name: FraudGraph AI CI/CD Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-intelligence-tests:
    name: 🐍 Python Backend & Graph Engine (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: apps/api
        run: |
          pytest apps/api/tests/ -v --durations=10

  frontend-workbench-tests:
    name: ⚛️ Frontend React & Graph Engine (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test -- --run

      - name: Production TypeScript Build
        run: npm run build

  security-and-license-audit:
    name: 🛡️ Security & Zero-Secret Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify No Secrets or Private Keys
        run: |
          echo "Scanning for sensitive patterns..."
          if grep -rnE "(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN PRIVATE KEY)" --exclude-dir={.git,node_modules,.venv,dist} .; then
            echo "❌ CRITICAL: Unmasked API secret or private key pattern detected!"
            exit 1
          else
            echo "✅ Zero secrets detected. Clean audit passed."
          fi
